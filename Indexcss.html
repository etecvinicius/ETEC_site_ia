<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Principais IAs</title>

  <style>
    :root {
      --fundo: #07111F;
      --fundo-secundario: #0D1B2A;
      --texto: #EAF4FF;
      --texto-secundario: #9DB7D1;
      --azul-destaque: #36A3FF;
      --azul-hover: #55B7FF;
      --borda: #244766;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--fundo);
      color: var(--texto);
      font-family: Arial, sans-serif;
    }

    .cabecalho {
      padding: 20px 8%;
      background-color: var(--fundo-secundario);
      border-bottom: 1px solid var(--borda);
      text-align: center;
    }

    .cabecalho h1 {
      margin: 0;
      color: var(--azul-destaque);
      font-size: 32px;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      width: 84%;
      max-width: 1100px;
      margin: 20px auto;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--texto);
      text-decoration: none;
    }

    .menu a:hover {
      color: var(--azul-hover);
    }

    .menu img,
    .rodape img {
      width: 35px;
      height: 35px;
    }

    main {
      width: 84%;
      max-width: 1100px;
      min-height: 300px;
      margin: 0 auto;
      padding: 70px 0;
      text-align: center;
    }

    main h2 {
      margin: 0;
      font-size: 40px;
    }

    .rodape {
      padding: 25px;
      background-color: var(--fundo-secundario);
      border-top: 1px solid var(--borda);
      color: var(--texto-secundario);
      text-align: center;
    }

    .rodape p {
      margin: 0 0 12px;
    }

    .rodape a {
      display: inline-block;
    }
  </style>
</head>
<body>
  <header class="cabecalho">
    <h1>Por um banner, icone, sla</h1>
  </header>

  <nav class="menu" aria-label="Navegação principal">
    <a href="Pesquisa.docx" download>
      <img src="Img/download.png" alt="Parte para acesso da pesquisa">
      Baixar pesquisa completa
    </a>
  </nav>

  <main>
    <h2>Historia das Ias</h2>

    <br>

    <br>

    <br>
    <br>
    <br>
    <br>
</main>

  <footer class="rodape">
    <p>Contato</p>
    <a href="mailto:etecprojinfo@gmail.com" aria-label="Enviar e-mail">
      <img src="Img/email.png" alt="E-mail">
    </a>
  </footer>
</body>
</html>
